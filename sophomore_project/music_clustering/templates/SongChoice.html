{% extends 'base.html' %}

{% block title %}Rate Song{% endblock %}

{% block header-title %}Rate Song{% endblock %}

{% block content %}

<div class="container">

  <h1>Rate Your Favorite Songs</h1>

  <img id="song-image" src="{{ current_song_info.img_src }}" alt="{{ current_song_info.img_src }}" />
  <h2 id="song-title">
    Now Playing: {{ current_song_info.track_name }} by {{ current_song_info.artist_name }}
  </h2>
  <form method="POST">
    {% csrf_token %}
    <input type="hidden" id="song" name="song" value="{{ current_song_info.song.id }}" />

    <label for="rating">Rate this song:</label>
    <input type="range" name="rating" id="rating" min="0" max="10" step="1" value="5" />
    <span id="ratingValue">5</span>

    <button type="submit">Submit Rating</button>
  </form>
</div>

<script>
  // Update the displayed rating value when the slider changes
  const slider = document.getElementById("rating");
  const ratingValue = document.getElementById("ratingValue");

  slider.oninput = function () {
    ratingValue.textContent = this.value;
  };

  let RatingInProgress = false;

  document.addEventListener("DOMContentLoaded", () => {
    const songTitleElement = document.getElementById("song-title");
    const songImageElement = document.getElementById("song-image");
    function fetchSongInfo() {
      if (RatingInProgress) {
        return; // Exit if the rate function is currently processing
      }
      axios
        .get("", {
          headers: {
            "X-Requested-With": "XMLHttpRequest",
          },
        })
        .then((response) => {
          const songInfo = response.data;

          if (
            songInfo.track_name === undefined ||
            songInfo.artist_name === undefined
          ) {
            songTitleElement.textContent = "No song currently playing";
            songImageElement.setAttribute("src", "No image")
          } else {
            songTitleElement.textContent = `Now Playing: ${songInfo.track_name} by ${songInfo.artist_name}`;
            songImageElement.setAttribute("src", songInfo.img_src);
          }
        })
        .catch((error) => {
          console.log(error);
          songTitleElement.textContent = "No song currently playing";
        });
    }

    fetchSongInfo();

    // Set an interval to fetch the song info every 5 seconds
    setInterval(fetchSongInfo, 2000);

    const ratingForm = document.querySelector("form");
    ratingForm.addEventListener("submit", (event) => {
      event.preventDefault();

      RatingInProgress = true;

      const formData = new FormData(ratingForm);
      const data = Object.fromEntries(formData);
      data.action = "rate_song";

      const csrfToken = document
        .querySelector('meta[name="csrf-token"]')
        .getAttribute("content");

      axios.defaults.headers.common["X-CSRFToken"] = csrfToken;

      //If doesn't work, put data in instead of rate_song
      axios
        .post("", data, {
          headers: {
            ' Content-Type': 'application/json'
          }
        })
        .then((response) => {
          console.log("Rating submitted");
        })
        .catch((error) => {
          console.error("Error submitting rating:", error);
        })
        .finally(() => {
          // Reset the flag when done
          RatingInProgress = false;
          ratingValue.textContent = "5";
          slider.value = 5;
        });
    });
  });
</script>

{% endblock %}
